name: Build & Release Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build
        run: |
          npm install
          npm run build

      - name: Setup Capacitor & Fix Kotlin Conflicts
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.evojan34.surgeon",
            "appName": "Surgeon",
            "webDir": "dist",
            "server": {
              "url": "https://evojan34.github.io/Surgeon/",
              "cleartext": true
            }
          }
          EOF
          npx cap add android

          # إزالة تعارض حزم Kotlin المكررة نهائياً
          echo "
          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          " >> android/build.gradle

          echo "
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          " >> android/app/build.gradle

      - name: Compile Standalone APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Surgeon.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Surgeon Board Suite v1.0.0"
          body: "تطبيق الأندرويد المستقل لمنصة جراحة البورد (ملف تثبيت مباشر APK)"
          files: ./Surgeon.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
