name: Generate Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize Android Project
        run: |
          bubblewrap init --manifest https://evojan34.github.io/Surgeon/manifest.webmanifest || true

      - name: Build APK
        run: |
          echo "Building standalone APK..."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Surgeon-App-APK
          path: "*.apk"
