name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build Project
        run: |
          npm install
          npm run build

      - name: Configure Capacitor & Solve Kotlin Duplication
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.evojan34.surgeon",
            "appName": "Surgeon",
            "webDir": "dist",
            "server": {
              "url": "https://evojan34.github.io/Surgeon/",
              "cleartext": true
            }
          }
          EOF
          npx cap add android

          # حل تعارض مكتبات Kotlin بشكل نهائي
          cat << 'EOF' >> android/build.gradle
          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

      - name: Compile APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Final APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Surgeon.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Surgeon-App-APK
          path: Surgeon.apk
