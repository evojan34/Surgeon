name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build
        run: |
          npm install
          npm run build

      - name: Setup Capacitor for Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.evojan34.surgeon",
            "appName": "Surgeon",
            "webDir": "dist",
            "server": {
              "url": "https://evojan34.github.io/Surgeon/",
              "cleartext": true
            }
          }
          EOF
          npx cap add android

      - name: Compile Standalone APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Surgeon.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Surgeon-App-APK
          path: Surgeon.apk
