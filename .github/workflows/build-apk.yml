name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build APK via TWA
        run: |
          mkdir build-android && cd build-android
          npx @bubblewrap/cli init --manifest="https://evojan34.github.io/Surgeon/manifest.webmanifest" --skipPwaValidation || true
          echo "Building standalone APK..."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Surgeon-APK
          path: "**/*.apk"
